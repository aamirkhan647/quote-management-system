[pytest]
# 1. Enable immediate logging output to the console
log_cli = True 

# 2. Set the minimum level for logs shown in the console
log_cli_level = INFO 

# Optional: If your logging formatter uses fields other than time, level, message,
# you might want to specify the format here:
# log_cli_format = %(asctime)s - %(levelname)s - %(message)s